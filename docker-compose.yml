version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: planthealthcheck-mysql
    environment:
      # WARNING: Change this password in production!
      MYSQL_ROOT_PASSWORD: Dev_Password_2024!
      MYSQL_DATABASE: plant_health_check
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Infrastructure/Data/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./Infrastructure/Data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - planthealthcheck-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: planthealthcheck-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - planthealthcheck-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: planthealthcheck-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - planthealthcheck-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  planthealthcheck-network:
    driver: bridge
